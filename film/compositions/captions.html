pan></div><div id="caption-1" class="clip cap " data-start="2.008667" data-duration="2.517333"><span>For about eight minutes and twenty seconds,</span></div><div id="caption-2" class="clip cap " data-start="4.586000" data-duration="1.450667"><span>you&#x27;d notice <em>nothing</em>.</span></div><div id="caption-3" class="clip cap " data-start="6.216667" data-duration="1.856000"><span><em>Sun</em>light already in space</span></div><div id="caption-4" class="clip cap " data-start="8.102667" data-duration="2.133333"><span>would still be racing toward Earth.</span></div><div id="caption-5" class="clip cap " data-start="10.436000" data-duration="1.728000"><span>Then daylight would end.</span></div><div id="caption-6" class="clip cap " data-start="12.464000" data-duration="2.368000"><span>In this impossible thought experiment,</span></div><div id="caption-7" class="clip cap " data-start="14.882000" data-duration="3.584000"><span>changes in <em>gravity</em> also travel at <em>light speed</em>.</span></div><div id="caption-8" class="clip cap " data-start="18.616000" data-duration="1.962667"><span>Earth would leave its solar orbit,</span></div><div id="caption-9" class="clip cap " data-start="20.628667" data-duration="2.176000"><span>moving roughly along a tangent.</span></div><div id="caption-10" class="clip cap " data-start="23.004667" data-duration="2.026667"><span>But we wouldn&#x27;t instantly <em>freeze</em>.</span></div><div id="caption-11" class="clip cap " data-start="25.131333" data-duration="2.368000"><span>The oceans and atmosphere store <em>heat</em>.</span></div><div id="caption-12" class="clip cap " data-start="27.659333" data-duration="3.072000"><span>Without <em>sunlight</em>, <em>photosynthesis</em> would stop,</span></div><div id="caption-13" class="clip cap " data-start="30.811333" data-duration="1.941333"><span>and the surface would keep <em>cooling</em>.</span></div><div id="caption-14" class="clip cap " data-start="33.032667" data-duration="1.280000"><span>Now the twist.</span></div><div id="caption-15" class="clip cap word" data-start="34.552667" data-duration="0.746667"><span><em>Life</em></span></div><div id="caption-16" class="clip cap word" data-start="35.334333" data-duration="0.682667"><span>could</span></div><div id="caption-17" class="clip cap word" data-start="36.052000" data-duration="1.002667"><span><em>survive</em>.</span></div><div id="caption-18" class="clip cap " data-start="37.234667" data-duration="2.730667"><span>Around seafloor vents, some microbes</span></div><div id="caption-19" class="clip cap " data-start="40.005333" data-duration="3.029333"><span>use <em>chemical energy</em> instead of <em>sunlight</em>.</span></div><div id="caption-20" class="clip cap " data-start="43.184667" data-duration="1.898667"><span>Earth&#x27;s internal <em>heat</em> wouldn&#x27;t disappear</span></div><div id="caption-21" class="clip cap " data-start="45.103333" data-duration="1.130667"><span>with the <em>Sun</em>.</span></div><div id="caption-22" class="clip cap " data-start="46.434000" data-duration="2.090667"><span>Our world could lose its star,</span></div><div id="caption-23" class="clip cap " data-start="48.684667" data-duration="3.050667"><span>without immediately losing every living thing.</span></div></div><script>const tl=gsap.timeline({paused:true});tl.fromTo("#caption-0 span",{y:12,scale:1.025,opacity:0},{y:0,scale:1,opacity:1,duration:.10,ease:"power2.out"},0.18);tl.fromTo("#caption-1 span",{y:12,scale:1.025,opacity:0},{y:0,scale:1,opacity:1,duration:.10,ease:"power2.out"},2.0086666666666666);tl.fromTo("#caption-2 span",{y:12,scale:1.025,opacity:0},{y:0,scale:1,opacity:1,duration:.10,ease:"power2.out"},4.586);tl.fromTo("#caption-3 span",{y:12,scale:1.025,opacity:0},{y:0,scale:1,opacity:1,duration:.10,ease:"power2.out"},6.216666666666667);tl.fromTo("#caption-4 span",{y:12,scale:1.025,opacity:0},{y:0,scale:1,opacity:1,duration:.10,ease:"power2.out"},8.102666666666666);tl.fromTo("#caption-5 span",{y:12
